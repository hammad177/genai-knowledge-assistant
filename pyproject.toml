[project]
name = "genai-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hammad177", email = "hammad.shaukat2016@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ddgs>=9.14.4",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-neo4j>=0.10.0",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "mem0ai>=2.0.18",
    "neo4j>=6.2.0",
    "pydantic-ai>=2.29.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
genai-knowledge-assistant = "genai_knowledge_assistant:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
