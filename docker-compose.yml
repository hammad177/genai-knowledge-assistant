services:
  neo4j:
    image: neo4j:5-community
    container_name: genai-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (web UI)
      - "7687:7687" # Bolt protocol (driver connections)
    environment:
      - NEO4J_AUTH=neo4j/your_neo4j_password_here
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
